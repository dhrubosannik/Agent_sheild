[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield"
version = "0.1.0"
description = "AgentShield Python SDK for protecting AI-agent tools"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.8",
    "PyYAML>=6.0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentshield*"]
